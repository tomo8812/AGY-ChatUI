name: PR3A dependency lock preparation
on:
  push:
    branches: [feat/artifact-platform-pr3a-chat]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve prospective editor dependencies without modifying the branch
        run: |
          git show HEAD:package-lock.json > /tmp/pr3a-base-lock.json
          npm install --workspace=web --package-lock-only --ignore-scripts --save-exact @tiptap/react@3.35.0 @tiptap/starter-kit@3.35.0 @tiptap/core@3.35.0 @tiptap/pm@3.35.0 @codemirror/state@6.7.6 @codemirror/view@6.44.0 @codemirror/commands@6.11.2 @codemirror/language@6.13.1 @codemirror/lang-markdown@6.5.2 @codemirror/lang-javascript@6.2.5 @codemirror/search@6.7.3 @tanstack/react-virtual@3.14.28 fast-formula-parser@1.0.19
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const old = JSON.parse(fs.readFileSync('/tmp/pr3a-base-lock.json'));
          const next = JSON.parse(fs.readFileSync('package-lock.json'));
          console.log('PR3A_MANIFEST '+JSON.stringify(JSON.parse(fs.readFileSync('web/package.json'))));
          for (const key of new Set([...Object.keys(old.packages),...Object.keys(next.packages)])) {
            if(JSON.stringify(old.packages[key])!==JSON.stringify(next.packages[key])) console.log('PR3A_LOCK_ENTRY '+JSON.stringify([key,next.packages[key]??null]));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pr3a-resolved-lock
          path: |
            package-lock.json
            web/package.json
